[package]
name = "omcp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI bridge exposing a small safe omcp-core API to Kotlin (M5 Android beta, experimental)"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "omcp_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
omcp-core = { path = "../omcp-core" }
uniffi = "=0.28.3"
thiserror = "=2.0.11"
hex = "=0.4.3"
zeroize = "=1.9.1"
