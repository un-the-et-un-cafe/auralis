[package]
name = "omcp-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Open Mesh Chat Protocol (OMCP) core — framing and Noise hybrid handshake (M1)"
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Classical Noise building blocks (Noise_IK_25519_ChaChaPoly_BLAKE2b)
blake2 = "=0.10.6"
chacha20poly1305 = "=0.10.1"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

# PQ KEM (FIPS 203) for suite OMCP-2026-A hybrid
# Requires rustc >= 1.87 (via ctutils); CI uses dtolnay stable.
ml-kem = { version = "=0.3.3", features = ["getrandom"] }

# Hybrid shared-secret mix per PROTOCOL §5.1: HKDF(X25519_ss || ML-KEM_ss)
hkdf = "=0.12.4"
sha2 = "=0.10.8"

getrandom = "=0.2.15"
thiserror = "=2.0.11"
zeroize = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
hex = "=0.4.3"
