name: OpenMeshChat
options:
  bundleIdPrefix: chat.omcp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  OpenMeshChat:
    type: application
    platform: iOS
    sources:
      - path: OpenMeshChat
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.omcp.app
      INFOPLIST_FILE: OpenMeshChat/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1.0"
      DEVELOPMENT_TEAM: ""
