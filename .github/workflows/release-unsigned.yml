name: Package unsigned release candidates

# No tag trigger, signing credentials, deployment, GitHub Release or store upload.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character reviewed commit SHA; fail if the selected ref moved
        required: true
        type: string
      confirm_unsigned:
        description: Build review-only unsigned artifacts, not a public release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  confirm:
    name: Confirm unsigned packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_unsigned }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$CONFIRMED" = true
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

  quality:
    name: Quality gates
    needs: confirm
    uses: ./.github/workflows/ci.yml

  android:
    name: Android unsigned APK and AAB
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android build tools
        uses: ./.github/actions/setup-android-build
      - name: Build native core and unsigned packages
        working-directory: apps/android
        run: |
          ./scripts/build-rust.sh
          ./gradlew assembleRelease bundleRelease lintRelease testReleaseUnitTest --no-daemon --console=plain
      - name: Stage packages, dependency resolution and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/auralis-android"
          cp apps/android/app/build/outputs/apk/release/*-unsigned.apk "$RUNNER_TEMP/auralis-android/"
          cp apps/android/app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/auralis-android/"
          cp Cargo.lock "$RUNNER_TEMP/auralis-android/"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/auralis-android/cargo-metadata.json"
          {
            printf 'Auralis unsigned review artifacts\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            rustc --version --verbose
            cargo ndk --version
            java -version 2>&1
            printf 'NDK: %s\n' "$ANDROID_NDK_HOME"
          } > "$RUNNER_TEMP/auralis-android/BUILD_INFO.txt"
          cd "$RUNNER_TEMP/auralis-android"
          sha256sum ./* > SHA256SUMS
      - name: Upload unsigned Android review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-android-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/auralis-android/
          if-no-files-found: error
          retention-days: 14
      - name: Upload release test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-android-release-reports-${{ github.sha }}
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS unsigned archive and FFI SDK
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up iOS build tools
        uses: ./.github/actions/setup-ios-build
      - name: Build an unsigned device archive
        working-directory: apps/ios
        run: |
          ./scripts/build-rust.sh
          xcodegen generate
          xcodebuild -project OpenMeshChat.xcodeproj -scheme OpenMeshChat \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Auralis.xcarchive \
            -resultBundlePath build/Auralis-archive.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Stage archive, bindings, dependency resolution and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/auralis-ios"
          tar -czf "$RUNNER_TEMP/auralis-ios/Auralis-unsigned.xcarchive.tar.gz" \
            -C apps/ios/build Auralis.xcarchive
          tar -czf "$RUNNER_TEMP/auralis-ios/OmcpFFI-sdk.tar.gz" \
            -C apps/ios build/OmcpFFI.xcframework Generated/OmcpFFI
          cp Cargo.lock "$RUNNER_TEMP/auralis-ios/"
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/auralis-ios/cargo-metadata.json"
          {
            printf 'Auralis unsigned review artifacts; not an installable IPA\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            rustc --version --verbose
            xcodebuild -version
            xcodegen --version
          } > "$RUNNER_TEMP/auralis-ios/BUILD_INFO.txt"
          cd "$RUNNER_TEMP/auralis-ios"
          shasum -a 256 ./* > SHA256SUMS
      - name: Upload unsigned iOS review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-ios-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/auralis-ios/
          if-no-files-found: error
          retention-days: 14
      - name: Upload archive diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-ios-archive-results-${{ github.sha }}
          path: apps/ios/build/Auralis-archive.xcresult
          if-no-files-found: warn
          retention-days: 14
