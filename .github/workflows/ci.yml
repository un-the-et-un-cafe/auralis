name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A reusable invocation must not cancel its parent release workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust using the repository toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustc --version --verbose
      - name: Test CI safety helpers and source invariant guard
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify audited OMCP source invariants
        run: python3 scripts/check_protocol_invariants.py
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Cargo test (including OMCP simulations)
        run: cargo test --locked --workspace

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android build tools
        uses: ./.github/actions/setup-android-build
      - name: Build omcp-ffi (.so and Kotlin bindings)
        working-directory: apps/android
        run: ./scripts/build-rust.sh
      - name: Assemble, lint and test Android
        working-directory: apps/android
        run: ./gradlew assembleDebug bundleDebug lintDebug testDebugUnitTest --no-daemon --console=plain
      - name: Validate packaged native libraries and bundle-derived APK
        run: |
          scripts/ci/validate-android-packages.sh \
            apps/android/app/build/outputs/apk/debug/app-debug.apk \
            apps/android/app/build/outputs/bundle/debug/app-debug.aab
      - name: Upload Android reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-android-reports-${{ github.sha }}
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stage installable development APK and identity
        run: |
          mkdir -p "$RUNNER_TEMP/auralis-android-debug"
          cp apps/android/app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/auralis-android-debug/"
          {
            printf 'Auralis debug test build, not a release. Use synthetic test data only.\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Application ID: chat.auralis.app.debug\nMinimum Android API: 31\n'
            printf 'The generated debug signing key can change between CI runs. Do not uninstall an existing app without backing up its data.\n'
          } > "$RUNNER_TEMP/auralis-android-debug/BUILD_INFO.txt"
          cd "$RUNNER_TEMP/auralis-android-debug"
          sha256sum ./*.apk BUILD_INFO.txt > SHA256SUMS
      - name: Upload development APK (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-debug-apk-${{ github.sha }}
          path: ${{ runner.temp }}/auralis-android-debug/
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    name: android runtime (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35, 36-16k]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect KVM and grant only this disposable runner UID access
        run: |
          mkdir -p apps/android/app/build/reports/emulator
          { uname -a; id; if [[ -e /dev/kvm ]]; then stat /dev/kvm; fi; } | tee apps/android/app/build/reports/emulator/host.txt
          python3 scripts/ci/kvm_access.py prepare
      - name: Set up Android build tools
        uses: ./.github/actions/setup-android-build
      - name: Build native core and instrumentation APKs
        working-directory: apps/android
        run: |
          ./scripts/build-rust.sh
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --console=plain
      - name: Run real app instrumentation on an accelerated emulator
        working-directory: apps/android
        env:
          API_LEVEL: ${{ matrix.api }}
        run: ../../scripts/ci/run-android-emulator-tests.sh "$API_LEVEL"
      - name: Upload runtime test reports and emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-android-runtime-api${{ matrix.api }}-${{ github.sha }}
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Revoke only this job's KVM UID grant
        if: ${{ always() }}
        run: python3 scripts/ci/kvm_access.py cleanup

  ios:
    name: ios (iOS ${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        # Keep existing older-runtime coverage; iOS 17 remains an explicit gap.
        runtime: ["18.5", "26.2"]
    # The Rust build script produces an arm64, not an Intel, simulator slice.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up iOS build tools
        uses: ./.github/actions/setup-ios-build
      - name: HoplaKit (SwiftPM) tests
        working-directory: apps/ios/HoplaKit
        run: swift test
      - name: Strings EN/FR parity
        run: python3 scripts/strings.py --check
      - name: Build omcp-ffi xcframework and Swift bindings
        run: ./scripts/build-rust.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Create a clean pinned iPhone simulator
        id: sim
        env:
          IOS_RUNTIME: ${{ matrix.runtime }}
        run: |
          xcrun simctl list runtimes -j > build/simulator-runtimes.json
          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_RUNTIME//./-}"
          UDID=$(xcrun simctl create AuralisCI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME_ID")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Build simulator app and tests with local ad-hoc signatures
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # Simulator-only local signing needs no account/certificate/profile.
          # Disabling it strips Keychain entitlements and breaks real persistence.
          xcodebuild -project OpenMeshChat.xcodeproj -scheme OpenMeshChat \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath build/Auralis-build.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build-for-testing
      - name: Verify simulator signature and existing Keychain entitlement
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/OpenMeshChat.app
          mkdir -p build/Signing
          codesign --verify --deep --strict "$APP"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          import re
          import shutil
          # Xcode embeds simulator entitlements in a Mach-O segment, not necessarily
          # in the ad-hoc signature. Inspect its generated linker input, then the
          # real Keychain roundtrip test below proves runtime access actually works.
          candidates = list(Path("build/DerivedData/Build/Intermediates.noindex").rglob("OpenMeshChat.app-Simulated.xcent"))
          assert len(candidates) == 1, candidates
          shutil.copyfile(candidates[0], "build/Signing/app-simulator-entitlements.plist")
          with candidates[0].open("rb") as stream:
              entitlements = plistlib.load(stream)
          # Matches the existing app entitlement. Xcode may synthesize a simulator
          # prefix; never accept wildcard, extra, or unrelated shared groups.
          groups = entitlements.get("keychain-access-groups")
          assert isinstance(groups, list) and len(groups) == 1, entitlements
          assert isinstance(groups[0], str) and re.fullmatch(r"(?:[A-Za-z0-9]+\.)?chat\.auralis\.app", groups[0]), entitlements
          app_identifier = entitlements.get("application-identifier")
          assert app_identifier is None or app_identifier == groups[0], entitlements
          print("Verified generated simulator entitlements contain the existing app-only Keychain group.")
          PY
      - name: Run bridge and real app UI tests
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild -project OpenMeshChat.xcodeproj -scheme OpenMeshChat \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath build/Auralis-tests.xcresult \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test-without-building
      - name: Upload simulator test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-ios-test-results-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            apps/ios/build/Auralis-*.xcresult
            apps/ios/build/Signing/
            apps/ios/build/simulator-runtimes.json
            apps/ios/build/Toolchain/
          if-no-files-found: warn
          retention-days: 14

      - name: Stage installable Apple silicon simulator app
        env:
          IOS_RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p "$RUNNER_TEMP/auralis-ios-simulator"
          tar -czf "$RUNNER_TEMP/auralis-ios-simulator/Auralis-simulator.app.tar.gz" \
            -C build/DerivedData/Build/Products/Debug-iphonesimulator OpenMeshChat.app
          {
            printf 'Auralis simulator test build; NOT an iPhone IPA or release. Use synthetic test data only.\nCommit: %s\nRun: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Application ID: chat.auralis.app\nValidated runtime: iOS %s, iPhone 16, Apple silicon\n' "$IOS_RUNTIME"
            xcodebuild -version
            lipo -archs build/DerivedData/Build/Products/Debug-iphonesimulator/OpenMeshChat.app/OpenMeshChat
          } > "$RUNNER_TEMP/auralis-ios-simulator/BUILD_INFO.txt"
          cd "$RUNNER_TEMP/auralis-ios-simulator"
          shasum -a 256 ./*.tar.gz BUILD_INFO.txt > SHA256SUMS
      - name: Upload simulator app (not an iPhone package)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auralis-ios-simulator-app-${{ matrix.runtime }}-${{ github.sha }}
          path: ${{ runner.temp }}/auralis-ios-simulator/
          if-no-files-found: error
          retention-days: 7
      - name: Stop and delete the disposable simulator
        if: ${{ always() && steps.sim.outputs.udid != '' }}
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"

  required:
    name: required checks
    if: ${{ always() }}
    needs: [workflows, rust, android, android-runtime, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality gate to pass
        env:
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_RUNTIME_RESULT: ${{ needs.android-runtime.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          for result in "$WORKFLOWS_RESULT" "$RUST_RESULT" "$ANDROID_RESULT" "$ANDROID_RUNTIME_RESULT" "$IOS_RESULT"; do
            test "$result" = success
          done
