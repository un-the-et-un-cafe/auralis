name: Set up iOS build tools
description: Shared unsigned iOS build environment on an Apple silicon macOS runner.
runs:
  using: composite
  steps:
    - name: Select the reviewed Xcode version
      shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
        test -d "$DEVELOPER_DIR"
        # Confirm the actual tools, not just a mutable application-directory name.
        test "$(xcodebuild -version)" = $'Xcode 26.3\nBuild version 17C529'
        test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.2
        test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 26.2
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/apps/ios/build/Toolchain"
        {
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes -j
        } > "$GITHUB_WORKSPACE/apps/ios/build/Toolchain/inventory.txt"
    - name: Install Rust targets and pinned XcodeGen
      shell: bash
      run: |
        test "$(uname -m)" = arm64
        rustup show active-toolchain
        rustup target add aarch64-apple-ios aarch64-apple-ios-sim
        TOOLS="$RUNNER_TEMP/auralis-xcodegen"
        mkdir -p "$TOOLS"
        curl --fail --location --retry 3 --max-time 180 \
          https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
          -o "$TOOLS/xcodegen.zip"
        echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $TOOLS/xcodegen.zip" | shasum -a 256 --check
        unzip -q "$TOOLS/xcodegen.zip" -d "$TOOLS"
        echo "$TOOLS/xcodegen/bin" >> "$GITHUB_PATH"
        rustc --version --verbose
        xcodebuild -version
        "$TOOLS/xcodegen/bin/xcodegen" --version
