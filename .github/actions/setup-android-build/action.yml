name: Set up Android build tools
description: Shared unsigned Android build environment for CI and manual packaging.
runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"
    - name: Validate Gradle wrapper and configure caching
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
        validate-wrappers: true
    - name: Install Android SDK and Rust targets
      shell: bash
      env:
        NDK_VERSION: "27.2.12479018"
        CMDLINE_TOOLS_BUILD: "13114758"
        CMDLINE_TOOLS_SHA256: "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee"
      run: |
        rustup show active-toolchain
        rustup target add aarch64-linux-android x86_64-linux-android
        cargo install cargo-ndk --version 4.1.2 --locked
        # Pin CLI 19 rather than the runner's mutable latest SDK manager shim.
        # Archive verified against Google's repository metadata before SHA-256 pinning.
        TOOLS="$RUNNER_TEMP/auralis-android-tools"
        mkdir -p "$TOOLS"
        curl --fail --location --retry 3 --max-time 180 \
          "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_BUILD}_latest.zip" \
          -o "$TOOLS/tools.zip"
        echo "$CMDLINE_TOOLS_SHA256  $TOOLS/tools.zip" | sha256sum --check --strict
        unzip -q "$TOOLS/tools.zip" -d "$TOOLS"
        # avdmanager derives the SDK root from this canonical directory layout;
        # unlike sdkmanager it has no --sdk_root option.
        SDK_CLI="$ANDROID_HOME/cmdline-tools/19.0"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        if [[ -e "$SDK_CLI" || -L "$SDK_CLI" ]]; then
          mv "$SDK_CLI" "$TOOLS/runner-commandline-tools-19"
        fi
        mv "$TOOLS/cmdline-tools" "$SDK_CLI"
        SDKMANAGER="$SDK_CLI/bin/sdkmanager"
        # Use the hosted SDK's already accepted licenses only. A genuinely new
        # license is an approval blocker, never blanket-accepted by this workflow.
        "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
          "platform-tools" "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;35.0.0" < /dev/null
        test -s "$ANDROID_HOME/platforms/android-36/android.jar"
        test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
        test "$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' \
          "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties")" = "$NDK_VERSION"
        # Override both supported aliases: the hosted image can export a different
        # ANDROID_NDK_ROOT even when cargo-ndk correctly prefers NDK_HOME.
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        echo "ANDROID_AVDMANAGER=$SDK_CLI/bin/avdmanager" >> "$GITHUB_ENV"
        rustc --version --verbose
        java -version
